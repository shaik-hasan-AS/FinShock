AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  FinShock Quant - 10-Service Serverless Quantitative Risk Engine & Scenario Lab (100% Free Tier)

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.11
    Tracing: Active # AWS X-Ray Distributed Tracing (Free Tier: 100k traces/mo)
    Environment:
      Variables:
        FINSHOCK_DYNAMODB_TABLE: !Ref ExperimentsTable
        FINSHOCK_S3_BUCKET: !Ref ReportsBucket
        FINSHOCK_SNS_TOPIC_ARN: !Ref RiskAlertTopic
        FINSHOCK_SQS_QUEUE_URL: !Ref SimulationQueue
        FINSHOCK_SSM_PARAM_NAME: !Ref RiskFreeRateParameter

Resources:
  # 1 & 2. API Gateway (HTTP API v2) - Low-cost, fast routing
  FinShockHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins:
          - "*"

  # 3. Main Quantitative Lambda Function
  FinShockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend.handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExperimentsTable
        - S3CrudPolicy:
            BucketName: !Ref ReportsBucket
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt RiskAlertTopic.TopicName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SimulationQueue.QueueName
        - SSMParameterReadPolicy:
            ParameterName: finshock/config/*
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinShockHttpApi
            Path: /api/{proxy+}
            Method: ANY
        # 4. Amazon EventBridge - Nightly Automated Portfolio Stress Check
        NightlyStressCheck:
          Type: Schedule
          Properties:
            Schedule: cron(0 2 * * ? *) # Runs at 02:00 UTC daily
            Description: Automated nightly portfolio stress-testing against macro shocks
            Enabled: true

  # 5. Amazon DynamoDB - Saved experiments & portfolios (Pay-Per-Request, Always Free)
  ExperimentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: finshock_experiments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # 6. Amazon S3 - Exported quantitative reports & historical datasets
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub finshock-reports-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # 7. Amazon SNS - Risk Breach Alert Notifications
  RiskAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: finshock-risk-alerts
      DisplayName: FinShock Quant Risk Breach Notifications

  # 8. Amazon SQS - Asynchronous Heavy Monte Carlo Simulation Queue
  SimulationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: finshock-simulation-queue
      MessageRetentionPeriod: 86400
      VisibilityTimeout: 60

  # 9. AWS Systems Manager (SSM) Parameter Store - Centralized Dynamic Config (Always Free)
  RiskFreeRateParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /finshock/config/risk_free_rate
      Type: String
      Value: "0.065" # 6.5% benchmark repo rate
      Description: Global benchmark risk-free interest rate for Sharpe ratio calculations

  # 10. Amazon CloudWatch - High Risk Drawdown Metric Alarm
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: FinShock-Lambda-Errors
      AlarmDescription: Triggers when quantitative engine encounters unexpected runtime exceptions
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref FinShockFunction

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL (Amazon API Gateway)
    Value: !Sub "https://${FinShockHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api"
  DynamoDBTableName:
    Description: DynamoDB Table Name (Amazon DynamoDB)
    Value: !Ref ExperimentsTable
  ReportsBucketName:
    Description: S3 Reports Bucket (Amazon S3)
    Value: !Ref ReportsBucket
  RiskAlertTopicArn:
    Description: SNS Topic ARN for risk alerts (Amazon SNS)
    Value: !Ref RiskAlertTopic
  SimulationQueueUrl:
    Description: SQS Queue URL for async simulation tasks (Amazon SQS)
    Value: !Ref SimulationQueue
  SSMParameterPath:
    Description: SSM Parameter Store path (AWS Systems Manager)
    Value: !Ref RiskFreeRateParameter
